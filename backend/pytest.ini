[pytest]
asyncio_mode = auto
testpaths = tests
log_cli = true
log_cli_level = INFO
markers =
    requires_ollama: test needs Ollama running
    requires_elevenlabs: test needs ElevenLabs API key
    requires_home_assistant: test needs Home Assistant
    requires_google_calendar: test needs Google Calendar credentials
    requires_camera: test needs a camera device
    requires_microphone: test needs a microphone device
    requires_piper: test needs piper TTS binary
    slow: test takes more than 5 seconds
